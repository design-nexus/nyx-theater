[package]
name = "nyx-theater"
version = "0.1.0"
description = "A unified Plex and Jellyfin theater for Nyx"
edition.workspace = true
license.workspace = true

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
nyx-playback = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
nyx-media-model = { path = "../../crates/nyx-media-model" }
nyx-media-cache = { path = "../../crates/nyx-media-cache" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
nyx-plex = { path = "../../crates/nyx-plex" }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
async-channel = "2"
zbus = "5"
nyx-jellyfin = { path = "../../crates/nyx-jellyfin" }

rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
libc = "0.2"
